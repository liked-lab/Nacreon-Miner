              if tag == 'v0.23.6':
                  require(expected == {'Nacreon_linux-0.23.6.tar.gz': '7d42217af2128930124eb5b9384fe96e37157322d24d9f8d63b945f5efea20f1', 'Nacreon_hiveos_custom-0.23.6.tar.gz': '5bcb4527c735e6bd46f0e907c9d2ad8197f1a025ce5f67ad5074bcbb7c90f1ba'}, 'Current release differs from approved exact archive pair')
                  for filename, approved in expected.items():
