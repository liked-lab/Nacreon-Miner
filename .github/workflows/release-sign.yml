                          for arch, digest in {'sm86': '3bbaa32b6350e0411f4191ecfb4c2d3079eef0397f3d7bdb6c9b09c22fe8f687', 'sm89': 'f3ec56df1cc475008998880ed8fd42a283bf659c7ee8eea3cdc915cd0b7b347a', 'sm120': '9ac6a21e1d0fb2d1732abfa37853eebbbc3476cc1f13961c3142612d64df83ed'}.items():
                              data = archive.extractfile(root+'bin/nacreon-'+arch).read()
                              require(hashlib.sha256(data).hexdigest() == digest, 'Native SHA differs from approved CPU-verified build')
                          for proof_name, digest in {'libproof.so': '3bbb69f06de383fade608c4688e31b9ac22fee36eef107b9e1e1644dfbb4a1af', 'bin/libproof.so': '3bbb69f06de383fade608c4688e31b9ac22fee36eef107b9e1e1644dfbb4a1af', 'bin/libproof-sm120.so': 'c83240dab7da04e1645c4fba06de7c707c6136749264b55de736e19c11f865bb'}.items():
