                          for arch, digest in {'sm86': 'a123eb84877133ff41faae753fb12af999e79adfb13e2e57dca72739bdf91db4', 'sm89': 'c5bc4427b40e5fc13ddd5a8d5d99c4c0c0c7b8fea0ec8d597201a566b04d0e8a', 'sm120': '44b6db4fc32848d6cf8e7568ab3e88e6bdb76de6a184f7ce2f93d59d76b262db'}.items():
                              data = archive.extractfile(root+'bin/nacreon-'+arch).read()
                              require(hashlib.sha256(data).hexdigest() == digest, 'Native SHA differs from approved CPU-verified build')
                          for proof_name in ('libproof.so','bin/libproof.so'):
                              require(hashlib.sha256(archive.extractfile(root+proof_name).read()).hexdigest() == '3bbb69f06de383fade608c4688e31b9ac22fee36eef107b9e1e1644dfbb4a1af', 'Proof SHA differs from approved exact pair')
                          sums = archive.extractfile(root+'SHA256SUMS').read().decode().splitlines()
                          checked = set()
                          for line in sums:
                              digest, name = line.split('  ', 1)
                              require(name not in checked and '..' not in Path(name).parts and not Path(name).is_absolute(), 'Unsafe checksum name')
                              checked.add(name)
                              member = members[root+name]
                              require(member.isfile() and not member.issym() and not member.islnk(), 'Unsafe package member')
                              require(hashlib.sha256(archive.extractfile(member).read()).hexdigest() == digest, 'Internal package checksum differs')
                          require({root+n for n in checked} == set(members)-{root+'SHA256SUMS'}, 'Incomplete internal checksum coverage')
              if tag == 'v0.23.7':
                  require(expected == {'Nacreon_linux-0.23.7.tar.gz': 'e19ddee8bb372c802aeda8e260bffe6abc3a9aa6f088c776323b57db62438e34', 'Nacreon_hiveos_custom-0.23.7.tar.gz': 'b13cf29428fbe26500ca91e0636b23d4b35382e06e3a81c6b42a1dc350913074'}, 'Current release differs from approved exact archive pair')
