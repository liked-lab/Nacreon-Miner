                              require(member.isfile() and not member.issym() and not member.islnk(), 'Unsafe package member')
                              require(hashlib.sha256(archive.extractfile(member).read()).hexdigest() == digest, 'Internal package checksum differs')
                          require({root+n for n in checked} == set(members)-{root+'SHA256SUMS'}, 'Incomplete internal checksum coverage')
              if tag == 'v0.24.0':
                  require(expected == {'Nacreon_linux-0.24.0.tar.gz': 'ae3c242fd1a2a1945aca9386caca5f0237516fae3068b3bf8ba7c89906a7b044', 'Nacreon_hiveos_custom-0.24.0.tar.gz': 'df3b4d0f8193845b3ee9b42312920e5e0e09304716ff8159cf1cd30788dcaa25'}, 'Release differs from approved exact 0.24.0 archives')
                  for filename in expected:
                      with tarfile.open(filename) as archive:
                          members = {m.name:m for m in archive.getmembers()}
                          require(len(members) == len(archive.getmembers()), 'Duplicate package members')
                          root = 'nacreon/' if filename.startswith('Nacreon_linux-') else 'Nacreon_hiveos_custom/'
                          for relative, digest in {'bin/libproof-sm120.so': 'a9da135a93b046ffb0b57813ecf8806c2c1f9c4f4d48d21729a64022ca16f26e', 'bin/libproof-sm75.so': '5fbda4f8566c832a7a0378203307766fe1775f88fb32082e8f54d2cf6cfe04df', 'bin/libproof.so': 'ce8b4de18a8c90dd5b426dba9e0e01e8feae745b3b44dc7c1bf9c0470a1c233d', 'bin/nacreon-sm120': '63b9fde2a4d75e9c9e854e3515d8f21462ab1466e82d5b2478c0afd7a0705386', 'bin/nacreon-sm75': 'cbf6733b2b46478a4f741481ece0b5fe24a8ade064cede212d69d6997345117e', 'bin/nacreon-sm86': '4103569f4d4e2f0af77d3bb39672abb2e69a0c1f9d0c99beafc07f875fb858ba', 'bin/nacreon-sm89': '4dc3facc018bc19e869459ba44c3e4d8d5e940370a0718bfd902128546b3d946', 'libproof.so': 'ce8b4de18a8c90dd5b426dba9e0e01e8feae745b3b44dc7c1bf9c0470a1c233d'}.items():
                              require(hashlib.sha256(archive.extractfile(root+relative).read()).hexdigest() == digest, 'Native/proof differs from selected exact build')
                          metadata = json.loads(archive.extractfile(root+'ARCHITECTURES.json').read())
                          require(metadata['version'] == '0.24.0' and metadata['private_candidate'] is False and metadata['nacreon_devfee']['basis_points'] == 80, 'Release metadata mismatch')
                          checked = set()
                          for line in archive.extractfile(root+'SHA256SUMS').read().decode().splitlines():
                              digest, relative = line.split('  ', 1)
                              require(relative not in checked and not Path(relative).is_absolute() and '..' not in Path(relative).parts, 'Unsafe checksum path')
                              checked.add(relative)
                              member = members[root+relative]
                              require(member.isfile() and not member.issym() and not member.islnk(), 'Unsafe package member')
                              data = archive.extractfile(member).read()
                              require(hashlib.sha256(data).hexdigest() == digest, 'Internal checksum mismatch')
                              if relative.endswith('.py'):
